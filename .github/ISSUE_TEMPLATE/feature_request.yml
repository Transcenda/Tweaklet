name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **This tracker is public.** Describe your use case in general terms; leave out
        private product names, hostnames, and internal details.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who hits it, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
